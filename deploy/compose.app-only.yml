# Dùng khi VPS đã có Caddy/Nginx riêng: app chỉ mở cổng nội bộ 127.0.0.1:${APP_PORT}.
services:
  app:
    build: ..
    restart: unless-stopped
    env_file: ../.env
    environment:
      PUBLIC_URL: https://${DOMAIN}
    # Cho app đọc dữ liệu Sales: thêm nhóm sở hữu thư mục Sales (install.sh tự lấy).
    group_add:
      - "${SALES_GID:-1000}"
    volumes:
      - ../data:/data
      # Business → Sales: thư mục dữ liệu Sales / Kế toán (bảng đơn tt_don), chỉ đọc.
      - ${SALES_DATA_DIR:-/opt/sothuchi/data}:/sales:ro
    ports:
      - "127.0.0.1:${APP_PORT:-8120}:3000"
